[package]
name = "frp-gui"
version = "1.0.0"
description = "Cross-platform FRP GUI Client and Console"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "frp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
flate2 = "1.0"
tar = "0.4"
zip = "2.1"
sysinfo = "0.30"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
keyring = { version = "4.1.5", features = ["v1"] }
russh = "0.45.0"
russh-keys = "0.45.0"
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
regex = "1.13.1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
aes-gcm = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
